<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마중구름</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f9ff;color:#172b4d;font:16px system-ui,sans-serif}button,input,select{font:inherit}.nav{min-height:68px;background:#fff;border-bottom:1px solid #dce5f0;display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,calc((100% - 1120px)/2))}.brand{font-size:22px;font-weight:900;color:#2456c4}.live{font-size:12px;background:#e7f8f4;color:#087a63;border-radius:99px;padding:6px 10px}.wrap{max-width:1120px;margin:auto;padding:28px 16px 60px}.hero{min-height:202px;background:linear-gradient(120deg,#173f94,#2456c4 60%,#5c92f1);color:#fff;border-radius:24px;padding:32px 40px;position:relative;overflow:hidden}.hero h1{font-size:31px;margin:8px 0}.hero p{color:#dceaff;line-height:1.55}.pilot{position:absolute;width:205px;right:18px;bottom:-30px}.search{position:relative;margin:-25px auto 0;max-width:920px;background:#fff;border:1px solid #dce5f0;border-radius:16px;padding:14px;box-shadow:0 12px 28px #17396722;display:flex;gap:10px}.input,select{flex:1;border:1px solid #dce5f0;border-radius:10px;padding:13px;min-height:44px}.primary,.secondary{border:0;border-radius:10px;padding:12px 17px;font-weight:850;min-height:44px;cursor:pointer}.primary{background:#2456c4;color:#fff}.secondary{background:#fff;color:#2456c4;border:1px solid #2456c4}.content{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;margin-top:28px}.title{font-size:21px;margin:0 0 8px}.muted{color:#52627a;font-size:14px;line-height:1.55}.card{background:#fff;border:1px solid #dce5f0;border-radius:18px;padding:18px;box-shadow:0 4px 16px #1739670a}.notice{margin:12px 0;padding:11px 13px;border-radius:10px;background:#fff2cc;color:#725300;font-size:13px}.filter{width:100%;padding:11px;border:1px solid #dce5f0;border-radius:10px}.list{max-height:560px;overflow:auto;margin-top:12px}.flight{display:grid;grid-template-columns:44px 1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid #edf1f7}.icon{width:42px;height:42px;background:#e9f1ff;color:#2456c4;border-radius:12px;display:grid;place-items:center}.num{font-weight:900;font-size:18px}.time{text-align:right;font-size:19px;font-weight:900}.time small{display:block;font-size:12px;color:#52627a}.choose{margin-top:7px;background:#fff;color:#2456c4;border:1px solid #2456c4;border-radius:8px;padding:9px 10px;font-weight:800;cursor:pointer;min-height:44px}.side{position:sticky;top:15px;height:max-content}.big{font-size:32px;font-weight:900;margin:3px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;border-top:1px solid #edf1f7;padding-top:15px}.grid small{display:block;color:#52627a}.cta{width:100%;margin-top:12px}.status{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.status button{padding:12px 8px;border:1px solid #2456c4;background:#fff;color:#2456c4;border-radius:10px;font-weight:800;min-height:44px}.share{display:flex;gap:8px;margin-top:12px}.share input{min-width:0;flex:1;padding:10px;border:1px solid #dce5f0;border-radius:9px}.ended{padding:40px;text-align:center}.form{display:grid;gap:10px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:720px){.hero{padding:25px 22px}.hero h1{font-size:27px;max-width:250px}.pilot{width:160px;right:-15px}.content{grid-template-columns:1fr}.side{position:static;order:-1}.list{max-height:none}.flight{grid-template-columns:40px 1fr}.time{grid-column:2;text-align:left}.search{flex-direction:column}.primary,.secondary{width:100%}}
.date-field{display:grid;gap:3px;color:#52627a;font-size:12px;min-width:160px}.date-field input{width:100%}.guide-wrap{margin-top:32px}.guide-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.guide-card h3{margin:0 0 4px}.guide-links{display:flex;gap:8px;margin-top:12px}.guide-links a{color:#2456c4;font-weight:800;text-decoration:none}.source-badge{font-size:11px;color:#52627a}.official-link{display:block;text-align:center;text-decoration:none}@media(max-width:900px){.guide-grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.guide-grid{grid-template-columns:1fr}.date-field{width:100%}}
</style></head><body><nav class="nav"><div class="brand">☁ 마중구름</div><div class="live">LIVE · 인천공항 공식 데이터</div></nav><main class="wrap" id="app"></main>
<script>
const A='/majoong/api/v1',app=document.querySelector('#app');let rows=[],selected,shareTimer;
const e=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Seoul'});
const offsetDate=n=>{let d=new Date(today()+'T12:00:00+09:00');d.setDate(d.getDate()+n);return d.toLocaleDateString('en-CA',{timeZone:'Asia/Seoul'})};
function hero(label,title,copy){return '<section class="hero"><div>'+label+'</div><h1>'+title+'</h1><p>'+copy+'</p><img class="pilot" src="assets/gureumi-hero-v1.png" alt="구름이 조종사"></section>'}
function home(){clearInterval(shareTimer);app.innerHTML=hero('INCHEON AIRPORT ARRIVALS','도착부터 만나는 순간까지,<br>함께 확인하세요.','날짜별 인천공항 도착 정보와 여행자가 알려주는 상태를 한곳에서 확인해요.')+'<section class="search"><label class="date-field" for="sd">조회 날짜<input class="input" id="sd" type="date" min="'+offsetDate(-3)+'" max="'+offsetDate(6)+'" value="'+today()+'"></label><label class="sr" for="q">편명 또는 출발 도시·공항</label><input class="input" id="q" placeholder="편명 또는 출발 도시·공항 입력 (예: CX426, 홍콩, HKG)"><button class="primary" onclick="search()">도착편 찾기</button><button class="secondary" onclick="tripForm()">미래 일정 등록</button></section><div class="content"><section><h2 class="title" id="listTitle">날짜별 도착편</h2><p class="muted">조회 가능 범위 '+offsetDate(-3)+' ~ '+offsetDate(6)+' · 모든 도착시각은 한국시간입니다.</p><div id="notice"></div><div class="card"><label class="sr" for="filter">현재 결과 내 검색</label><input id="filter" class="filter" placeholder="현재 결과 내 검색" oninput="renderList()"><div class="list" id="list"><p class="muted">날짜와 편명 또는 출발지를 선택해 조회해 주세요.</p></div></div></section><aside class="side"><div class="card" id="detail"><h2 class="title">항공편 선택</h2><p class="muted">목록에서 항공편을 고르면 시간과 장소를 확인하고 마중방을 만들 수 있어요.</p></div></aside></div><section class="guide-wrap"><h2 class="title">주요 공항 지도·편의시설</h2><p class="muted">공항 운영기관의 공식 안내로 연결합니다. 운영시간과 위치는 방문 당일 다시 확인해 주세요.</p><div class="guide-grid" id="airportGuides"><div class="card muted">공항 안내를 불러오는 중이에요.</div></div></section>';loadAirportGuides()}
async function search(){let q=document.querySelector('#q').value.trim(),date=document.querySelector('#sd').value,list=document.querySelector('#list');list.innerHTML='<p class="muted">항공편을 확인하고 있어요.</p>';try{let r=await fetch(A+'/flights?arrivalDate='+encodeURIComponent(date)+'&flightNumber='+encodeURIComponent(q)+'&direction=ARRIVAL'),j=await r.json();if(!r.ok)throw Error(j.message||j.detail||'공항 정보 갱신이 지연되고 있어요.');rows=j.items||[];let c=j.coverage||{},s=j.source||{};document.querySelector('#listTitle').textContent=e(j.query?.sourceLocalDate)+' 도착편';document.querySelector('#notice').innerHTML='<div class="notice">'+(c.state==='PARTIAL'?'일부 목록만 확인됐어요. 공급자 첫 100행 기준이며 해당 날짜 전체 운항편을 뜻하지 않아요. ':'')+'최근 확인 '+new Date(s.lastSuccessfulCollectionAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+' · '+e(j.query?.sourceLocalDate)+' 한국시간 · Redis 공통 캐시</div>';renderList()}catch(x){rows=[];list.innerHTML='<p class="muted">'+e(x.message)+'</p>'}}
async function loadAirportGuides(){try{let r=await fetch(A+'/airport-guides'),items=await r.json();document.querySelector('#airportGuides').innerHTML=items.map(x=>'<article class="card guide-card"><span class="source-badge">'+e(x.code)+' · '+e(x.operator)+'</span><h3>'+e(x.name)+'</h3><p class="muted">'+e(x.mapSummary)+'</p><p>'+e(x.facilities)+'</p><div class="guide-links"><a href="'+e(x.mapUrl)+'" target="_blank" rel="noopener noreferrer">공식 지도</a><a href="'+e(x.facilityUrl)+'" target="_blank" rel="noopener noreferrer">편의시설</a></div></article>').join('')}catch(_){document.querySelector('#airportGuides').innerHTML='<div class="card muted">공항 공식 안내를 불러오지 못했어요.</div>'}}
function renderList(){let v=document.querySelector('#filter').value.toLowerCase(),a=rows.filter(x=>(x.displayNumber+' '+x.origin+' '+x.originName).toLowerCase().includes(v));document.querySelector('#list').innerHTML=a.length?a.map(x=>'<article class="flight"><div class="icon">✈</div><div><div class="num">'+e(x.displayNumber)+'</div><div class="muted">'+e(x.originName)+' ('+e(x.origin)+') → 인천</div><div class="muted">'+e(x.scheduledDate)+' · '+e(x.status)+' · '+e(x.terminalDisplayName)+' · 입국 출구 '+e(x.arrivalExit)+'</div></div><div class="time">'+e(x.estimatedLocalTime)+'<small>예정 '+e(x.scheduledLocalTime)+'</small><button class="choose" aria-label="'+e(x.displayNumber)+' '+e(x.originName)+'발 항공편 선택" onclick="selectFlight(\''+e(x.id)+'\')">선택</button></div></article>').join(''):'<p class="muted">조건에 맞는 항공편이 없어요. 검색 조건을 지워보세요.</p>'}
function selectFlight(id){selected=rows.find(x=>x.id===id);let x=selected;document.querySelector('#detail').innerHTML='<h2 class="title">'+e(x.displayNumber)+' 선택됨</h2><p class="muted">'+e(x.originName)+' ('+e(x.origin)+') → 인천 · '+e(x.scheduledDate)+' 한국시간</p><div class="big">'+e(x.estimatedLocalTime)+'</div><p class="muted">변경 안내 시각 · 예정 '+e(x.scheduledLocalTime)+' · '+e(x.status)+'</p><div class="grid"><div><small>터미널</small><b>'+e(x.terminalDisplayName)+'</b></div><div><small>입국 출구</small><b>'+e(x.arrivalExit)+'</b></div><div><small>수하물 수취대</small><b>'+e(x.baggageCarousel)+'</b></div><div><small>최근 확인</small><b>'+new Date(x.observedAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+'</b></div></div><div class="notice">출구와 수취대는 서로 다른 안내입니다. 터미널 명칭은 인천공항 OpenAPI 공식 코드표 기준입니다.</div><a class="secondary cta official-link" href="https://www.airport.kr/ap_ko/index.do" target="_blank" rel="noopener noreferrer">인천공항 공식 지도·편의시설</a><button class="primary cta" onclick="createMeetup()">이 항공편으로 마중방 만들기</button>'}
async function createMeetup(){let x=selected,body={flightNumber:x.displayNumber,origin:x.origin,destination:x.destination,scheduledLocalTime:x.scheduledLocalTime,estimatedLocalTime:x.estimatedLocalTime,scheduledDate:x.scheduledDate,terminalDisplayName:x.terminalDisplayName,arrivalExit:x.arrivalExit,baggageCarousel:x.baggageCarousel};let r=await fetch(A+'/meetups',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)return alert('마중방 생성에 실패했어요.');meetup(await r.json())}
function meetup(m){app.innerHTML=hero('MY MEETUP',e(m.flight)+' 마중방',e(m.origin)+' → '+e(m.destination)+' · '+e(m.scheduledDate)+' · '+e(m.terminal)+' · 입국 출구 '+e(m.exit))+'<div class="content"><section class="card"><h2 class="title">내가 직접 알려주는 상태</h2><p class="muted" id="saved">아직 공유 안 함</p><div class="status"><button onclick="status(\''+m.id+'\',\'IMMIGRATION\')">입국심사 중</button><button onclick="status(\''+m.id+'\',\'WAITING_BAGGAGE\')">짐 기다리는 중</button><button onclick="status(\''+m.id+'\',\'OUTSIDE\')">밖으로 나왔어요</button><button onclick="completeMeetup(\''+m.id+'\')">만났어요</button></div><h3>함께 정한 만남 장소</h3><div class="form"><input class="input" id="place" maxlength="300" placeholder="예: 입국 출구 앞 안내 표지 근처" value="'+e(m.note)+'"><button class="primary" onclick="note(\''+m.id+'\')">장소 저장</button></div></section><aside class="side"><div class="card"><h2 class="title">가족에게 공유</h2><p class="muted">링크를 가진 사람은 항공편·상태·공개한 장소만 볼 수 있어요. 기본 24시간 후 종료됩니다.</p><button class="primary cta" onclick="share(\''+m.id+'\')">읽기 전용 링크 만들기</button><div id="share"></div></div></aside></div>'}
async function current(id){let r=await fetch(A+'/meetups/'+id);if(!r.ok)throw Error();return r.json()}
async function status(id,s){try{let m=await current(id),r=await fetch(A+'/meetups/'+id+'/traveler-status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s,expectedVersion:m.revision})});document.querySelector('#saved').textContent=r.ok?'저장됨':'저장 실패. 다시 시도해 주세요.'}catch(_){document.querySelector('#saved').textContent='저장 실패. 다시 시도해 주세요.'}}
async function note(id){try{let m=await current(id),r=await fetch(A+'/meetups/'+id+'/meeting-note',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:document.querySelector('#place').value,expectedVersion:m.revision})});document.querySelector('#saved').textContent=r.ok?'장소 저장됨':'저장 실패'}catch(_){document.querySelector('#saved').textContent='저장 실패'}}
async function completeMeetup(id){let m=await current(id);if(!confirm('만남을 완료하면 공유 링크가 종료돼요.'))return;let r=await fetch(A+'/meetups/'+id+'/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expectedVersion:m.revision})});if(r.ok)app.innerHTML='<div class="card ended"><h1>만남이 완료됐어요</h1><p class="muted">공유 링크가 종료되었습니다.</p><button class="primary" onclick="home()">처음으로</button></div>'}
async function share(id){let r=await fetch(A+'/meetups/'+id+'/shares',{method:'POST'}),j=await r.json();if(!r.ok)return;let url=location.origin+j.url;document.querySelector('#share').innerHTML='<div class="share"><input value="'+e(url)+'" readonly aria-label="읽기 전용 공유 링크"><button class="primary" onclick="navigator.clipboard.writeText(this.previousElementSibling.value)">복사</button></div><p class="muted">공유 범위: '+e(j.scope)+'</p>'}
function tripForm(){app.innerHTML=hero('MY TRIP','미래 일정 등록','당일 공식 운항 정보와 연결되기 전에는 직접 등록한 일정으로 표시합니다.')+'<section class="card" style="max-width:720px;margin:24px auto"><h2 class="title">내 여정</h2><div class="form"><label>여정 이름<input class="input" id="tn" value="나의 귀국 일정"></label><label>여정 유형<select id="tt" onchange="tripType()"><option value="ONE_WAY">편도</option><option value="ROUND_TRIP">왕복</option><option value="MULTI_CITY">다구간</option></select></label><div id="segments"></div><button class="primary" onclick="saveTrip()">직접 일정 저장</button><button class="secondary" onclick="home()">돌아가기</button><p id="tripmsg" class="muted"></p></div></section>';tripType()}
function segment(n,origin,dest){return '<fieldset class="form"><legend>'+n+' 구간</legend><label>편명<input class="input" data-f value=""></label><label>날짜<input class="input" data-d type="date" value="'+today()+'"></label><label>출발 공항<input class="input" data-o value="'+origin+'"></label><label>도착 공항<input class="input" data-x value="'+dest+'"></label></fieldset>'}
function tripType(){let t=document.querySelector('#tt').value,box=document.querySelector('#segments');box.innerHTML=segment('첫',t==='ROUND_TRIP'?'ICN':'','')+(t==='ONE_WAY'?'':segment(t==='ROUND_TRIP'?'귀국':'다음','',t==='ROUND_TRIP'?'ICN':''))}
async function saveTrip(){let cards=[...document.querySelectorAll('fieldset')],segs=cards.map(x=>({flightNumber:x.querySelector('[data-f]').value,date:x.querySelector('[data-d]').value,dateBasis:'ARRIVAL_LOCAL_DATE',origin:x.querySelector('[data-o]').value.toUpperCase(),destination:x.querySelector('[data-x]').value.toUpperCase()}));let r=await fetch(A+'/trips',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:document.querySelector('#tt').value,name:document.querySelector('#tn').value,segments:segs})});document.querySelector('#tripmsg').textContent=r.ok?'직접 등록한 일정이에요. 당일 정보와 연결할 예정이에요.':'입력한 편명·날짜·공항을 확인해 주세요.'}
async function shared(){let token=location.hash.replace('#token=','');if(!token){home();return}clearInterval(shareTimer);async function load(){let r=await fetch(A+'/shares/exchange',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});if(!r.ok){clearInterval(shareTimer);app.innerHTML='<div class="card ended"><h1>공유가 종료됐어요</h1><p class="muted">새 링크가 필요하면 여행자에게 요청해 주세요.</p><button class="primary" onclick="location.href=\'/majoong/\'">서비스 홈</button></div>';return}let j=await r.json();app.innerHTML='<div class="card"><p class="muted">공식 운항 정보 · 최근 확인 '+new Date(j.lastCheckedAt).toLocaleTimeString('ko-KR')+'</p><h1>'+e(j.flight.displayNumber)+' · '+e(j.flight.origin)+' → 인천</h1><div class="big">'+e(j.arrival.estimatedLocalTime)+'</div><p>'+e(j.arrival.date)+' 한국시간 · 예정 '+e(j.arrival.scheduledLocalTime)+' · '+e(j.airportInfo.terminal)+' · 입국 출구 '+e(j.airportInfo.arrivalExit)+'</p><hr><h2>여행자가 알려준 상태</h2><p>'+e(j.traveler.status)+' · '+new Date(j.traveler.updatedAt).toLocaleTimeString('ko-KR')+'</p><h2>함께 정한 만남 장소</h2><p>'+e(j.meetingNote||'아직 장소를 정하지 않았어요.')+'</p><p class="muted">이 화면은 읽기 전용이며 15초마다 권한과 변경 사항을 확인합니다.</p></div>'}await load();shareTimer=setInterval(load,15000)}
location.pathname.endsWith('/s')?shared():home();
</script></body></html>
