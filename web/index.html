<style>
*{box-sizing:border-box}body{margin:0;background:#f5f9ff;color:#172b4d;font:16px system-ui,sans-serif}button,input,select{font:inherit}.nav{min-height:68px;background:#fff;border-bottom:1px solid #dce5f0;display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,calc((100% - 1120px)/2))}.brand{font-size:22px;font-weight:900;color:#2456c4}.nav-actions{display:flex;align-items:center;gap:10px}.monitor{font-size:12px;font-weight:800;color:#2456c4;text-decoration:none;border:1px solid #b9cae8;border-radius:99px;padding:6px 10px}.live{font-size:12px;background:#e7f8f4;color:#087a63;border-radius:99px;padding:6px 10px}.wrap{max-width:1120px;margin:auto;padding:28px 16px 60px}.hero{min-height:202px;background:linear-gradient(120deg,#173f94,#2456c4 60%,#5c92f1);color:#fff;border-radius:24px;padding:32px 40px;position:relative;overflow:hidden}.hero h1{font-size:31px;margin:8px 0}.hero p{color:#dceaff;line-height:1.55}.pilot{position:absolute;width:205px;right:18px;bottom:-30px}.search{position:relative;margin:-25px auto 0;max-width:920px;background:#fff;border:1px solid #dce5f0;border-radius:16px;padding:14px;box-shadow:0 12px 28px #17396722;display:flex;gap:10px}.input,select{flex:1;border:1px solid #dce5f0;border-radius:10px;padding:13px;min-height:44px}.primary,.secondary{border:0;border-radius:10px;padding:12px 17px;font-weight:850;min-height:44px;cursor:pointer}.primary{background:#2456c4;color:#fff}.secondary{background:#fff;color:#2456c4;border:1px solid #2456c4}.content{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;margin-top:28px}.title{font-size:21px;margin:0 0 8px}.muted{color:#52627a;font-size:14px;line-height:1.55}.card{background:#fff;border:1px solid #dce5f0;border-radius:18px;padding:18px;box-shadow:0 4px 16px #1739670a}.notice{margin:12px 0;padding:11px 13px;border-radius:10px;background:#fff2cc;color:#725300;font-size:13px}.filter{width:100%;padding:11px;border:1px solid #dce5f0;border-radius:10px}.list{max-height:560 .guide-wrap{margin-top:32px}.guide-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.guide-card h3{margin:0 0 4px}.guide-links{display:flex;gap:8px;margin-top:12px}.guide-links a{color:#2456c4;font-weight:800;text-decoration:none}.source-badge{font-size:11px;color:#52627a}.official-link{display:block;text-align:center;text-decoration:none}.brand{border:0;background:transparent;padding:0;cursor:pointer}.side{transform:translateY(-18px)}@media(max-width:900px){.guide-grid{grid-template-columns:1fr 1fr}}@media(max-width:720px){.side{transform:none}}@media(max-width:520px){.guide-grid{grid-template-columns:1fr}}
</style><style>
.scroll-sentinel{text-align:center;color:#52627a;font-size:13px;padding:18px 8px;min-height:64px}.wallet-form{max-width:920px;margin:26px auto}.wallet-form-head,.wallet-toolbar,.wallet-actions,.segment-head,.wallet-card>header{display:flex;align-items:center;justify-content:space-between;gap:16px}.compact{min-height:38px;padding:8px 13px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form-grid label,.trip-segment>label{display:grid;gap:6px;font-size:13px;font-weight:750;color:#52627a}.trip-segment{border:1px solid #cddbf0;border-radius:16px;padding:18px;margin:18px 0;background:#f9fbff}.segment-head{margin-bottom:15px}.segment-head legend{font-size:18px;font-weight:900;color:#172b4d}.text-button{border:0;background:transparent;color:#d13b51;font-weight:800;cursor:pointer}.memo{resize:vertical;min-height:80px;margin-top:6px}.add-segment{width:100%;margin-bottom:16px}.wallet-actions{justify-content:flex-end}.wallet-toolbar{margin:28px 0 18px}.wallet-list{display:grid;gap:22px;margin-bottom:20px}.wallet-card{background:linear-gradient(145deg,#173f94,#2f67d5);border-radius:24px;padding:24px;color:#fff;box-shadow:0 18px 40px #17396728;overflow:hidden}.wallet-card h2{margin:10px 0 4px;font-size:26px}.wallet-card header p{margin:0;color:#dceaff}.wallet-chip{display:inline-block;background:#ffffff25;border:1px solid #ffffff40;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:850}.dday{background:#fff;color:#2456c4;border-radius:14px;padding:12px 14px;white-space:nowrap}.wallet-segment{background:#fff;color:#172b4d;border-radius:18px;padding:18px;margin-top:18px;position:relative}.segment-number{position:absolute;top:14px;right:16px;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#e9f1ff;color:#2456c4;font-weight:900}.route-line{display:grid;grid-template-columns:1fr 1.6fr 1fr;align-items:center;gap:12px;padding-right:28px}.route-line>div:first-child{text-align:left}.route-line>div:last-child{text-align:right}.route-line small,.route-line span{display:block;color:#52627a;font-size:12px}.route-line strong{display:block;font-size:27px}.route-flight{text-align:center}.route-flight span{color:#2456c4;font-size:20px}.route-flight b{font-size:13px}.wallet-details{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:17px;padding-top:15px;border-top:1px dashed #cddbf0}.wallet-details small{display:block;color:#718096;font-size:11px}.wallet-details b{display:block;margin-top:3px}.wallet-memo{padding:11px 13px;background:#f5f8fd;border-radius:10px;font-size:13px}.flight-lookup{width:100%;margin-top:12px}.wallet-card footer{margin-top:18px}.wallet-card footer h3{margin:0 0 10px}.checklist{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.checklist label{background:#ffffff18;border:1px solid #ffffff36;border-radius:10px;padding:10px;font-size:13px}.wallet-card footer .muted{color:#dceaff}.empty-wallet{text-align:center;padding:44px}.empty-wallet>div{font-size:45px}.empty-wallet h2{margin-bottom:5px}@media(max-width:720px){.form-grid,.wallet-details{grid-template-columns:1fr 1fr}.wallet-form-head,.wallet-toolbar{align-items:flex-start}.wallet-toolbar{flex-direction:column}.wallet-toolbar .primary{width:100%}.route-line{grid-template-columns:1fr 1fr}.route-flight{grid-column:1/-1;grid-row:2}.checklist{grid-template-columns:1fr 1fr}.wallet-card{padding:16px}.wallet-actions{flex-direction:column}.wallet-actions button{width:100%}}@media(max-width:440px){.form-grid,.wallet-details{grid-template-columns:1fr}.wallet-card>header{align-items:flex-start}.route-line strong{font-size:23px}}

<script>
const A='/majoong/api/v1',app=document.querySelector('#app');let rows=[],selected,shareTimer,displayLimit=50,searching=false,listObserver;
const e=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Seoul'});
const offsetDate=n=>{let d=new Date(today()+'T12:00:00+09:00');d.setDate(d.getDate()+n);return d.toLocaleDateString('en-CA',{timeZone:'Asia/Seoul'})};
function hero(label,title,copy){return '<section class="hero"><div>'+label+'</div><h1>'+title+'</h1><p>'+copy+'</p><img class="pilot" src="assets/gureumi-hero-v1.png" alt="구름이 조종사"></section>'}
function home(){clearInterval(shareTimer);let p=new URLSearchParams(location.search),q=p.get('q')||'';app.innerHTML=hero('INCHEON AIRPORT ARRIVALS','도착부터 만나는 순간까지,<br>함께 확인하세요.','오늘 인천공항 도착 정보와 여행자가 알려주는 상태를 한곳에서 확인해요.')+'<form class="search" onsubmit="search(event)"><label class="sr" for="q">편명 또는 출발 도시·공항</label><input class="input" id="q" value="'+e(q)+'" placeholder="편명 또는 출발 도시·공항 입력 (예: CX426, 홍콩, HKG)"><button class="primary" id="searchButton" type="submit">오늘 도착편 찾기</button><button class="secondary" type="button" onclick="tripForm()">미래 일정 등록</button></form><div class="content"><section><h2 class="title" id="listTitle">오늘 도착편</h2><p class="muted">인천공항 공식 운항 정보 · 모든 도착 시각은 한국 시간입니다.</p><div id="notice" aria-live="polite"></div><div class="card"><label class="sr" for="filter">현재 결과 내 검색</label><input id="filter" class="filter" placeholder="현재 결과 내 검색" oninput="displayLimit=50;renderList()"><div class="list" id="list"><p class="muted">오늘 도착편을 불러오는 중이에요.</p></div></div></section><aside class="side"><div class="card" id="detail" tabindex="-1"><h2 class="title">항공편 선택</h2><p class="muted">목록에서 항공편을 고르면 시간과 장소를 확인하고 마중방을 만들 수 있어요.</p></div></aside></div><section class="guide-wrap"><h2 class="title">주요 공항 지도·편의시설</h2><p class="muted">공항 운영기관의 공식 안내로 연결합니다. 운영시간과 위치는 방문 당일 다시 확인해 주세요.</p><div class="guide-grid" id="airportGuides"><div class="card muted">공항 안내를 불러오는 중이에요.</div></div></section>';loadAirportGuides();search()}
function clearSelection(){selected=undefined;let detail=document.querySelector('#detail');if(detail)detail.innerHTML='<h2 class="title">항공편 선택</h2><p class="muted">목록에서 항공편을 고르면 시간과 장소를 확인하고 마중방을 만들 수 있어요.</p>'}
async function search(ev){ev?.preventDefault();if(searching)return;searching=true;let q=document.querySelector('#q').value.trim(),date=today(),list=document.querySelector('#list'),button=document.querySelector('#searchButton');clearSelection();displayLimit=50;button.disabled=true;list.innerHTML='<p class="muted">오늘 도착편을 확인하고 있어요.</p>';try{let r=await fetch(A+'/flights?arrivalDate='+encodeURIComponent(date)+'&flightNumber='+encodeURIComponent(q)+'&direction=ARRIVAL'),j=await r.json();if(!r.ok)throw Error(j.message||j.detail||'공항 정보 갱신이 지연되고 있어요.');rows=j.items||[];let c=j.coverage||{},s=j.source||{},params=new URLSearchParams();if(q)params.set('q',q);history.replaceState({},'',location.pathname+(params.toString()?'?'+params:''));document.querySelector('#listTitle').textContent='오늘 도착편';document.querySelector('#notice').innerHTML='<div class="notice">'+(c.state==='PARTIAL'?'일부 페이지를 불러오지 못했어요. 잠시 후 다시 조회해 주세요. ':'')+'공식 운항 정보 '+e(j.page?.returnedCount)+'건 · 최근 확인 '+new Date(s.lastSuccessfulCollectionAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+' · Redis 15분 캐시</div>';renderList()}catch(x){rows=[];document.querySelector('#notice').innerHTML='';list.innerHTML='<p class="muted">'+e(x.message)+'</p>'}finally{searching=false;button.disabled=false}}
async function loadAirportGuides(){try{let r=await fetch(A+'/airport-guides'),items=await r.json();document.querySelector('#airportGuides').innerHTML=items.map(x=>'<article class="card guide-card"><span class="source-badge">'+e(x.code)+' · '+e(x.operator)+'</span><h3>'+e(x.name)+'</h3><p class="muted">'+e(x.mapSummary)+'</p><p>'+e(x.facilities)+'</p><div class="guide-links"><a href="'+e(x.mapUrl)+'" target="_blank" rel="noopener noreferrer">공식 지도</a><a href="'+e(x.facilityUrl)+'" target="_blank" rel="noopener noreferrer">편의시설</a></div></article>').join('')}catch(_){document.querySelector('#airportGuides').innerHTML='<div class="card muted">공항 공식 안내를 불러오지 못했어요.</div>'}}
function renderList(){let v=document.querySelector('#filter').value.toLowerCase(),a=rows.filter(x=>(x.displayNumber+' '+x.origin+' '+x.originName).toLowerCase().includes(v)),shown=a.slice(0,displayLimit),list=document.querySelector('#list');listObserver?.disconnect();list.innerHTML=a.length?shown.map(x=>'<article class="flight"><div class="icon">✈</div><div><div class="num">'+e(x.displayNumber)+'</div><div class="muted">'+e(x.originName)+' ('+e(x.origin)+') → 인천</div><div class="muted">'+e(x.scheduledDate)+' · '+e(x.status)+' · '+e(x.terminalDisplayName)+' · 입국 출구 '+e(x.arrivalExit)+'</div></div><div class="time">'+e(x.estimatedLocalTime)+'<small>예정 '+e(x.scheduledLocalTime)+'</small><button class="choose" aria-label="'+e(x.displayNumber)+' '+e(x.originName)+'발 항공편 선택" onclick="selectFlight(\''+e(x.id)+'\')">선택</button></div></article>').join('')+(a.length>shown.length?'<div id="scrollSentinel" class="scroll-sentinel" aria-live="polite">'+shown.length+' / '+a.length+'편 표시 · 아래로 스크롤하면 더 불러옵니다.</div>':'<p class="muted">총 '+a.length+'편을 모두 표시했어요.</p>'):'<p class="muted">조건에 맞는 항공편이 없어요. 검색 조건을 지워보세요.</p>';let sentinel=document.querySelector('#scrollSentinel');if(sentinel&&'IntersectionObserver'in window){let scrollRoot=matchMedia('(max-width:720px)').matches?null:list;listObserver=new IntersectionObserver(entries=>{if(entries.some(x=>x.isIntersecting)){listObserver.disconnect();displayLimit+=50;renderList()}},{root:scrollRoot,rootMargin:'180px 0px'});listObserver.observe(sentinel)}}
function selectFlight(id){selected=rows.find(x=>x.id===id);let x=selected,detail=document.querySelector('#detail');let p=new URLSearchParams(location.search);p.set('flight',id);history.replaceState({},'',location.pathname+'?'+p);detail.innerHTML='<h2 class="title">'+e(x.displayNumber)+' 선택됨</h2><p class="muted">'+e(x.originName)+' ('+e(x.origin)+') → 인천 · '+e(x.scheduledDate)+' 한국시간</p><div class="big">'+e(x.estimatedLocalTime)+'</div><p class="muted">변경 안내 시각 · 예정 '+e(x.scheduledLocalTime)+' · '+e(x.status)+'</p><div class="grid"><div><small>터미널</small><b>'+e(x.terminalDisplayName)+'</b></div><div><small>입국 출구</small><b>'+e(x.arrivalExit)+'</b></div><div><small>수하물 수취대</small><b>'+e(x.baggageCarousel)+'</b></div><div><small>최근 확인</small><b>'+new Date(x.observedAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+'</b></div></div><div class="notice">출구와 수취대는 서로 다른 안내입니다. 터미널 명칭은 인천공항 OpenAPI 공식 코드표 기준입니다.</div><a class="secondary cta official-link" href="https://www.airport.kr/ap_ko/index.do" target="_blank" rel="noopener noreferrer">인천공항 공식 지도·편의시설</a><button class="primary cta" onclick="createMeetup()">이 항공편으로 마중방 만들기</button>';if(matchMedia('(max-width:720px)').matches){detail.scrollIntoView({behavior:'smooth',block:'start'});detail.focus({preventScroll:true})}
}
async function createMeetup(){let x=selected,body={flightNumber:x.displayNumber,origin:x.origin,destination:x.destination,scheduledLocalTime:x.scheduledLocalTime,estimatedLocalTime:x.estimatedLocalTime,scheduledDate:x.scheduledDate,terminalDisplayName:x.terminalDisplayName,arrivalExit:x.arrivalExit,baggageCarousel:x.baggageCarousel};let r=await fetch(A+'/meetups',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)return alert('마중방 생성에 실패했어요.');meetup(await r.json())}
function meetup(m){app.innerHTML=hero('MY MEETUP',e(m.flight)+' 마중방',e(m.origin)+' → '+e(m.destination)+' · '+e(m.scheduledDate)+' · '+e(m.terminal)+' · 입국 출구 '+e(m.exit))+'<div class="content"><section class="card"><h2 class="title">내가 직접 알려주는 상태</h2><p class="muted" id="saved">아직 공유 안 함</p><div class="status"><button onclick="status(\''+m.id+'\',\'IMMIGRATION\')">입국심사 중</button><button onclick="status(\''+m.id+'\',\'WAITING_BAGGAGE\')">짐 기다리는 중</button><button onclick="status(\''+m.id+'\',\'OUTSIDE\')">밖으로 나왔어요</button><button onclick="completeMeetup(\''+m.id+'\')">만났어요</button></div><h3>함께 정한 만남 장소</h3><div class="form"><input class="input" id="place" maxlength="300" placeholder="예: 입국 출구 앞 안내 표지 근처" value="'+e(m.note)+'"><button class="primary" onclick="note(\''+m.id+'\')">장소 저장</button></div></section><aside class="side"><div class="card"><h2 class="title">가족에게 공유</h2><p class="muted">링크를 가진 사람은 항공편·상태·공개한 장소만 볼 수 있어요. 기본 24시간 후 종료됩니다.</p><button class="primary cta" onclick="share(\''+m.id+'\')">읽기 전용 링크 만들기</button><div id="share"></div></div></aside></div>'}
async function current(id){let r=await fetch(A+'/meetups/'+id);if(!r.ok)throw Error();return r.json()}
async function status(id,s){try{let m=await current(id),r=await fetch(A+'/meetups/'+id+'/traveler-status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s,expectedVersion:m.revision})});document.querySelector('#saved').textContent=r.ok?'저장됨':'저장 실패. 다시 시도해 주세요.'}catch(_){document.querySelector('#saved').textContent='저장 실패. 다시 시도해 주세요.'}}
async function note(id){try{let m=await current(id),r=await fetch(A+'/meetups/'+id+'/meeting-note',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:document.querySelector('#place').value,expectedVersion:m.revision})});document.querySelector('#saved').textContent=r.ok?'장소 저장됨':'저장 실패'}catch(_){document.querySelector('#saved').textContent='저장 실패'}}
async function completeMeetup(id){let m=await current(id);if(!confirm('만남을 완료하면 공유 링크가 종료돼요.'))return;let r=await fetch(A+'/meetups/'+id+'/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expectedVersion:m.revision})});if(r.ok)app.innerHTML='<div class="card ended"><h1>만남이 완료됐어요</h1><p class="muted">공유 링크가 종료되었습니다.</p><button class="primary" onclick="home()">처음으로</button></div>'}
async function share(id){let r=await fetch(A+'/meetups/'+id+'/shares',{method:'POST'}),j=await r.json();if(!r.ok)return;let url=location.origin+j.url;document.querySelector('#share').innerHTML='<div class="share"><input value="'+e(url)+'" readonly aria-label="읽기 전용 공유 링크"><button class="primary" onclick="navigator.clipboard.writeText(this.previousElementSibling.value)">복사</button></div><p class="muted">공유 범위: '+e(j.scope)+'</p>'}
function tripForm(){app.innerHTML=hero('TRAVEL WALLET','내 여행 지갑 만들기','예약과 탑승에 필요한 정보를 구간별 카드로 모아두세요.')+'<section class="wallet-form card"><div class="wallet-form-head"><div><h2 class="title">여정 기본 정보</h2><p class="muted">여권번호처럼 민감한 정보는 저장하지 마세요.</p></div><button class="secondary compact" type="button" onclick="tripList()">저장한 지갑 보기</button></div><div class="form-grid"><label>여정 이름<input class="input" id="tn" value="나의 여행" placeholder="예: 도쿄 가족여행"></label><label>여정 유형<select id="tt" onchange="tripType()"><option value="ONE_WAY">편도</option><option value="ROUND_TRIP">왕복</option><option value="MULTI_CITY">다구간</option></select></label></div><div id="segments"></div><button class="secondary add-segment" id="addSegment" type="button" onclick="addSegment()" hidden>＋ 구간 추가</button><div class="wallet-actions"><button class="primary" onclick="saveTrip()">여행 지갑에 저장</button><button class="secondary" onclick="home()">취소</button></div><p id="tripmsg" class="muted" aria-live="polite"></p></section>';tripType()}
function segment(n,origin='',dest='',removable=false){return '<fieldset class="trip-segment"><div class="segment-head"><legend>'+n+' 구간</legend>'+(removable?'<button class="text-button" type="button" onclick="this.closest(\'fieldset\').remove()">구간 삭제</button>':'')+'</div><div class="form-grid"><label>항공사<input class="input" data-airline maxlength="80" placeholder="예: 대한항공"></label><label>편명 *<input class="input" data-f maxlength="20" placeholder="예: KE703"></label><label>출발일 *<input class="input" data-d type="date" value="'+today()+'"></label><label>예약번호<input class="input" data-booking maxlength="40" placeholder="예: A1B2C3"></label><label>출발 공항 *<input class="input" data-o maxlength="3" placeholder="ICN" value="'+origin+'"></label><label>도착 공항 *<input class="input" data-x maxlength="3" placeholder="NRT" value="'+dest+'"></label><label>출발 시각<input class="input" data-depart type="time"></label><label>도착 시각<input class="input" data-arrive type="time"></label><label>터미널<input class="input" data-terminal maxlength="40" placeholder="예: 제2여객터미널"></label><label>게이트<input class="input" data-gate maxlength="20" placeholder="예: 248"></label><label>좌석<input class="input" data-seat maxlength="20" placeholder="예: 23A"></label><label>수하물<input class="input" data-baggage maxlength="80" placeholder="예: 위탁 1개 23kg"></label></div><label>메모<textarea class="input memo" data-memo maxlength="300" placeholder="공항철도, 픽업, 체크인 등 기억할 내용"></textarea></label></fieldset>'}
function tripType(){let t=document.querySelector('#tt').value,box=document.querySelector('#segments'),add=document.querySelector('#addSegment');box.innerHTML=segment('가는',t==='ROUND_TRIP'?'ICN':'','')+(t==='ONE_WAY'?'':segment(t==='ROUND_TRIP'?'오는':'다음','',t==='ROUND_TRIP'?'ICN':'',t==='MULTI_CITY'));add.hidden=t!=='MULTI_CITY'}
function addSegment(){let box=document.querySelector('#segments'),n=box.querySelectorAll('fieldset').length+1;box.insertAdjacentHTML('beforeend',segment(n+'번째','','',true))}
function segmentValue(x,key){return x.querySelector('[data-'+key+']').value.trim()}
async function saveTrip(){let cards=[...document.querySelectorAll('fieldset')],segs=cards.map(x=>({flightNumber:segmentValue(x,'f').toUpperCase(),date:segmentValue(x,'d'),dateBasis:'DEPARTURE_LOCAL_DATE',origin:segmentValue(x,'o').toUpperCase(),destination:segmentValue(x,'x').toUpperCase(),airline:segmentValue(x,'airline'),bookingReference:segmentValue(x,'booking').toUpperCase(),departureTime:segmentValue(x,'depart'),arrivalTime:segmentValue(x,'arrive'),terminal:segmentValue(x,'terminal'),gate:segmentValue(x,'gate'),seat:segmentValue(x,'seat').toUpperCase(),baggage:segmentValue(x,'baggage'),memo:segmentValue(x,'memo')})),button=document.querySelector('.wallet-actions .primary');button.disabled=true;let r=await fetch(A+'/trips',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:document.querySelector('#tt').value,name:document.querySelector('#tn').value.trim(),segments:segs})}),j=await r.json().catch(()=>({}));button.disabled=false;if(r.ok){await tripList();return}document.querySelector('#tripmsg').textContent=j.message||'필수 항목과 구간 순서를 확인해 주세요.'}
function tripLabel(t){return {ONE_WAY:'편도',ROUND_TRIP:'왕복',MULTI_CITY:'다구간'}[t]||t}
function dday(date){let days=Math.ceil((new Date(date+'T00:00:00+09:00')-new Date())/86400000);return days===0?'오늘 출발':days>0?'D-'+days:'출발 완료'}
function detailItem(label,value){return '<div><small>'+label+'</small><b>'+e(value||'미입력')+'</b></div>'}
function checkState(id){try{return JSON.parse(localStorage.getItem('majoong-check-'+id)||'{}')}catch(_){return {}}}
function toggleTripCheck(id,key,checked){let state=checkState(id);state[key]=checked;localStorage.setItem('majoong-check-'+id,JSON.stringify(state))}
function checklist(id){let s=checkState(id),items=[['identity','여권·신분증'],['ticket','항공권·예약번호'],['baggage','수하물 규정'],['transport','공항 이동수단']];return '<div class="checklist">'+items.map(x=>'<label><input type="checkbox" '+(s[x[0]]?'checked':'')+' onchange="toggleTripCheck(\''+id+'\',\''+x[0]+'\',this.checked)"> '+x[1]+'</label>').join('')+'</div>'}
function findTripFlight(number){location.href='/majoong/?q='+encodeURIComponent(number)}
function walletCard(t){let first=t.segments[0]||{},route=t.segments.map((s,i)=>'<section class="wallet-segment"><div class="segment-number">'+(i+1)+'</div><div class="route-line"><div><small>출발</small><strong>'+e(s.origin)+'</strong><span>'+e(s.departureTime||'시간 미입력')+'</span></div><div class="route-flight"><span>✈</span><b>'+e(s.airline||'항공사 미입력')+' · '+e(s.flightNumber)+'</b></div><div><small>도착</small><strong>'+e(s.destination)+'</strong><span>'+e(s.arrivalTime||'시간 미입력')+'</span></div></div><div class="wallet-details">'+detailItem('날짜',s.date)+detailItem('예약번호',s.bookingReference)+detailItem('터미널',s.terminal)+detailItem('게이트',s.gate)+detailItem('좌석',s.seat)+detailItem('수하물',s.baggage)+'</div>'+(s.memo?'<p class="wallet-memo">'+e(s.memo)+'</p>':'')+'<button class="secondary flight-lookup" onclick="findTripFlight(\''+e(s.flightNumber)+'\')">오늘 운항편에서 '+e(s.flightNumber)+' 찾기</button></section>').join('');return '<article class="wallet-card"><header><div><span class="wallet-chip">'+tripLabel(t.type)+'</span><h2>'+e(t.name)+'</h2><p>'+e(first.origin)+' → '+e((t.segments[t.segments.length-1]||{}).destination)+'</p></div><div class="wallet-head-actions"><strong class="dday">'+dday(first.date)+'</strong><button class="wallet-delete" aria-label="여행 지갑 삭제" onclick="deleteTrip(\''+e(t.id)+'\')">삭제</button></div></header>'+route+'<footer><h3>탑승 준비 체크</h3>'+checklist(t.id)+'<p class="muted">체크 상태는 이 브라우저에만 저장됩니다.</p></footer></article>'}
async function deleteTrip(id){if(!confirm('이 여행 지갑을 삭제할까요?'))return;let r=await fetch(A+'/trips/'+id,{method:'DELETE'});if(r.ok){localStorage.removeItem('majoong-check-'+id);tripList()}else alert('여행 지갑을 삭제하지 못했어요.')}
async function tripList(){clearInterval(shareTimer);app.innerHTML=hero('TRAVEL WALLET','내 여행 지갑','예약·탑승 정보와 준비 상태를 한눈에 확인하세요.')+'<div class="wallet-toolbar"><div><h2 class="title">저장한 여정</h2><p class="muted">예약번호, 좌석, 수하물과 메모를 구간별로 확인할 수 있어요.</p></div><button class="primary" onclick="tripForm()">＋ 새 여행 등록</button></div><div id="tripList" class="wallet-list"><div class="card muted">여행 지갑을 불러오는 중이에요.</div></div><button class="secondary" onclick="home()">홈으로</button>';try{let r=await fetch(A+'/trips'),items=await r.json();document.querySelector('#tripList').innerHTML=items.length?items.map(walletCard).join(''):'<section class="card empty-wallet"><div>🧳</div><h2>아직 저장한 여행이 없어요</h2><p class="muted">항공권 정보를 등록하면 여기에 여행 지갑이 만들어집니다.</p><button class="primary" onclick="tripForm()">첫 여행 등록하기</button></section>'}catch(_){document.querySelector('#tripList').innerHTML='<section class="card"><p>여행 지갑을 불러오지 못했어요.</p><button class="secondary" onclick="tripList()">다시 시도</button></section>'}}
async function shared(){let token=location.hash.replace('#token=','');if(!token){home();return}clearInterval(shareTimer);async function load(){let r=await fetch(A+'/shares/exchange',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});if(!r.ok){clearInterval(shareTimer);app.innerHTML='<div class="card ended"><h1>공유가 종료됐어요</h1><p class="muted">새 링크가 필요하면 여행자에게 요청해 주세요.</p><button class="primary" onclick="location.href=\'/majoong/\'">서비스 홈</button></div>';return}let j=await r.json();app.innerHTML='<div class="card"><p class="muted">공식 운항 정보는 마중방을 만들 때의 스냅샷입니다. 현재 운항 정보는 인천공항에서 다시 확인해 주세요.</p><h1>'+e(j.flight.displayNumber)+' · '+e(j.flight.origin)+' → 인천</h1><div class="big">'+e(j.arrival.estimatedLocalTime)+'</div><p>'+e(j.arrival.date)+' 한국시간 · 예정 '+e(j.arrival.scheduledLocalTime)+' · '+e(j.airportInfo.terminal)+' · 입국 출구 '+e(j.airportInfo.arrivalExit)+'</p><hr><h2>여행자가 알려준 상태</h2><p>'+e(j.traveler.status)+' · '+new Date(j.traveler.updatedAt).toLocaleTimeString('ko-KR')+'</p><h2>함께 정한 만남 장소</h2><p>'+e(j.meetingNote||'아직 장소를 정하지 않았어요.')+'</p><p class="muted">이 화면은 읽기 전용이며 15초마다 권한과 여행자 상태 변경을 확인합니다.</p></div>'}await load();shareTimer=setInterval(load,15000)}
location.pathname.endsWith('/s')?shared():home();
</script></body></html>
