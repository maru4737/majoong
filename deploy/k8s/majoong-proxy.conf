location = /majoong { return 301 /majoong/; }
location /majoong/ {
  proxy_pass http://192.168.219.102:31443/;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
}
location /majoong/api/ {
  rewrite ^/majoong/(.*)$ /$1 break;
  proxy_pass http://192.168.219.102:31443;
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_read_timeout 130s;
}

location = /majoong-monitor { return 301 /majoong-monitor/; }
location /majoong-monitor/ {
  auth_basic "Majoong operations";
  auth_basic_user_file /etc/nginx/.htpasswd-majoong-monitor;
  proxy_pass http://192.168.219.102:32561;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port 443;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
}
